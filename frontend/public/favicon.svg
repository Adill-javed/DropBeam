<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Soft Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gradient for the Droplet -->
    <linearGradient id="dropGrad" x1="100" y1="40" x2="412" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />    <!-- Electric Blue -->
      <stop offset="50%" stop-color="#8B5CF6" />   <!-- Royal Purple -->
      <stop offset="100%" stop-color="#10B981" />  <!-- Vibrant Emerald -->
    </linearGradient>

    <!-- Sharp Diagonal Beam Gradient -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="270" r="220" fill="url(#glowGrad)"/>

  <!-- Main Droplet Shape (Drop) -->
  <path d="M256,40 C256,40 400,192 400,320 C400,400 335,464 256,464 C177,464 112,400 112,320 C112,192 256,40 256,40 Z" 
        fill="url(#dropGrad)" 
        filter="url(#shadow)"/>

  <!-- Sleek 3D Gloss Highlight -->
  <path d="M256,56 C256,56 380,200 380,320 C380,375 330,444 256,444 C182,444 132,375 132,320 C132,200 256,56 256,56 Z" 
        fill="#FFFFFF" 
        opacity="0.12"/>

  <!-- High-Energy Transmission Diagonal Beam (Beam) -->
  <!-- A powerful double-headed speed lightning arrow intersecting the droplet -->
  <path d="M120,380 L350,150 L280,150 L392,120 L362,232 L292,232 L400,124 L170,354 L240,354 L128,384 L158,272 L228,272 Z" 
        fill="url(#beamGrad)" 
        filter="url(#shadow)"/>

  <!-- Concentric Orbital Ring (Friction-Free Connection) -->
  <circle cx="256" cy="290" r="190" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="16 20" opacity="0.3"/>
</svg>