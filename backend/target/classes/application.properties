spring.application.name=DropBeam
server.port=${PORT:8080}

# File Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Storage configuration
dropbeam.storage.location=./uploads

# CORS settings
dropbeam.cors.allowed-origins=http://localhost:5173

# Tomcat settings for large uploads
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=105MB
